# ============================================================
# 前端 nginx 配置：托管 SPA + 反向代理后端服务
# 与本地 vite.config.js 中的 proxy 规则保持一致
# ============================================================
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ---------- 主客服后端 ----------
    # /api/chat  →  http://customer-service-backend:18082/api/chat
    location /api/ {
        proxy_pass         http://customer-service-backend:18082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # ---------- 健康检查（前端入口探针，供容器 healthcheck 使用） ----------
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"cs-frontend"}';
    }

    # ---------- 电商业务服务 ----------
    # /commerce/users/u1001/orders  →  http://ecommerce-service:18081/users/u1001/orders
    location /commerce/ {
        proxy_pass         http://ecommerce-service:18081/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # ---------- 后端接口文档（便于调试） ----------
    location /docs {
        proxy_pass       http://customer-service-backend:18082/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass       http://customer-service-backend:18082/openapi.json;
        proxy_set_header Host $host;
    }

    # ---------- 登录 / 注册页（独立入口） ----------
    location = /login {
        try_files /login.html =404;
    }
    location = /register {
        try_files /login.html =404;
    }

    # ---------- SPA 前端路由 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源缓存 ----------
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
