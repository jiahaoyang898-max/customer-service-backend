# ============================================================
# 电商小二 · 全栈一键启动编排
#   mysql(13306) + ecommerce-service(18081)
#   + customer-service-backend(18082) + frontend(18080)
#
# 宿主端口全部绑 127.0.0.1，避让同机其他项目（data-agent 8081/3306、
# deep-agent-search 8080、ecommerce-operation-assistant 3308）
#
# 启动：双击 start.bat（推荐）或执行  docker compose up -d --build
# 停止：双击 stop.bat  或执行  docker compose down
# ============================================================
name: customer-service

services:
  # ----------------------------------------------------------
  # 1. MySQL 数据库：承载 customer_service / commerce 两个库
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: cs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_USER: itwwy
      MYSQL_PASSWORD: "123456"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动建库建表 + 灌入演示数据
      - ./external/docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - cs-net

  # ----------------------------------------------------------
  # 2. 电商业务服务（订单 / 商品 / 物流 / 退款 / 发货提醒）
  # ----------------------------------------------------------
  ecommerce-service:
    build:
      context: ./external/ecommerce-service-backend
      dockerfile: Dockerfile
    image: cs-ecommerce-service:1.0
    container_name: cs-ecommerce-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://itwwy:123456@mysql:3306/commerce?charset=utf8mb4
      APP_HOST: 0.0.0.0
      APP_PORT: "18081"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18081:18081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:18081/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - cs-net

  # ----------------------------------------------------------
  # 3. 主客服后端（FastAPI + LLM 对话引擎）
  # ----------------------------------------------------------
  customer-service-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cs-backend:1.0
    container_name: cs-backend
    restart: unless-stopped
    environment:
      # LLM 配置：从项目根目录 .env 插值注入，不打进镜像
      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      # 容器内网络地址（覆盖 .env 中的 127.0.0.1）
      DATABASE_URL: mysql+aiomysql://itwwy:123456@mysql:3306/customer_service?charset=utf8mb4
      COMMERCE_API_BASE_URL: http://ecommerce-service:18081
      APP_HOST: 0.0.0.0
      APP_PORT: "18082"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18082:18082"
    depends_on:
      mysql:
        condition: service_healthy
      ecommerce-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:18082/docs')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - cs-net

  # ----------------------------------------------------------
  # 4. 前端页面（Vue3 构建产物 + nginx 反向代理）
  #    浏览器入口：http://localhost:18080
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./external/customer-service-frontend
      dockerfile: Dockerfile
    image: cs-frontend:1.0
    container_name: cs-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      customer-service-backend:
        condition: service_healthy
      ecommerce-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - cs-net

volumes:
  mysql_data:
    name: customer-service-mysql-data

networks:
  cs-net:
    name: customer-service-net
    driver: bridge
