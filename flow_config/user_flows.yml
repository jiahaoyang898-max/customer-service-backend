slots:
  order_number:
    type: text
    label: 订单号
    description: 用户的订单号

  order_status:
    type: text
    label: 订单状态
    description: 订单当前状态

  order_summary:
    type: text
    label: 订单摘要
    description: 订单摘要信息

  tracking_number:
    type: text
    label: 物流单号
    description: 物流单号

  logistics_company:
    type: text
    label: 物流公司
    description: 物流公司名称

  logistics_status:
    type: text
    label: 物流进度
    description: 物流当前进度

  product_id:
    type: text
    label: 商品ID
    description: 当前咨询商品的唯一标识

  refund_reason:
    type: text
    label: 退款原因
    description: 申请退款的原因

  logistics_found:
    type: text
    label: 是否查到物流
    description: 物流查询结果标记，yes 表示查到物流记录，no 表示没查到

  logistics_missing_reason:
    type: text
    label: 查不到物流的原因
    description: 未查到物流的原因分类，not_shipped 表示订单尚未发货，query_failed 表示查询失败

  refund_result:
    type: text
    label: 退款提交结果
    description: 调用电商退款接口后的结果分类，success、duplicate、not_found 或 failed

  refund_id:
    type: text
    label: 退款单号
    description: 电商服务落库后返回的退款申请单号

flows:
  onboarding:
    name: 欢迎引导
    description: 在聊天窗口初次打开时欢迎用户，并介绍助手可处理的电商服务。这个 flow 通常由系统主动触发。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "你好，这里是 itwwy 电商助手。我可以帮你查订单状态、查物流、了解商品信息，或者提交退款申请。"
        next: end

      - id: end
        type: end
        next: []

  order_status_query:
    name: 订单状态查询
    description: 帮用户查询订单当前的处理状态，例如待付款、待发货、已发货或已完成。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请告诉我你的订单号。"
        next: lookup_order_status


      - id: lookup_order_status
        type: action
        action: action_lookup_order_status
        next: show_order_status

      - id: show_order_status
        type: action
        action: action_response
        args:
          text: "订单{{ slots.order_number }}当前状态是：{{ slots.order_status }}。{% if slots.order_summary %}{{ slots.order_summary }}。{% endif %}"
        next: end

      - id: end
        type: end
        next: []

  logistics_tracking:
    name: 物流查询
    description: 帮用户查询订单物流进度、物流单号和配送公司信息。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请告诉我你的订单号。"
        next: lookup_logistics

      - id: lookup_logistics
        type: action
        action: action_lookup_logistics
        next: show_logistics

      - id: show_logistics
        type: action
        action: action_response
        args:
          text: "{% if slots.logistics_found == 'no' %}{% if slots.logistics_missing_reason == 'not_shipped' %}订单{{ slots.order_number }}还没发货，暂时没有物流信息，等商家发出后我再帮你查物流进度。{% else %}订单{{ slots.order_number }}的物流信息暂时查不到，你可以稍后再试，或者我帮你转接人工客服。{% endif %}{% else %}订单{{ slots.order_number }}由{{ slots.logistics_company }}配送，物流单号是{{ slots.tracking_number }}。当前进度：{{ slots.logistics_status }}。{% endif %}"
        next: end

      - id: end
        type: end
        next: []

  refund_request:
    name: 退款申请
    description: 帮用户提交简单的退款申请，收集订单号和退款原因。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请告诉我你的订单号。"
        next: ask_refund_reason

      - id: ask_refund_reason
        type: collect
        slot_name: refund_reason
        response:
          text: "请简单说一下退款原因。"
        next: submit_refund

      - id: submit_refund
        type: action
        action: action_submit_refund
        next: show_refund_result

      - id: show_refund_result
        type: action
        action: action_response
        args:
          text: "{% if slots.refund_result == 'success' %}好的，订单{{ slots.order_number }}的退款申请已提交，原因是：{{ slots.refund_reason }}。{% if slots.refund_id %}退款单号是{{ slots.refund_id }}，{% endif %}后续会尽快为你处理。{% elif slots.refund_result == 'duplicate' %}订单{{ slots.order_number }}已经有一条正在处理中的退款申请，这次就不帮你重复提交了。你可以稍后查询退款进度，或者我帮你转接人工客服。{% elif slots.refund_result == 'not_found' %}订单号{{ slots.order_number }}没有查到，麻烦你核对一下订单号再发给我，我再帮你提交退款申请。{% else %}抱歉，订单{{ slots.order_number }}的退款申请这次没有提交成功，你可以稍后再试一次，或者我帮你转接人工客服处理。{% endif %}"
        next: end

      - id: end
        type: end
        next: []

  similar_product_recommendation:
    name: 相似商品推荐
    description: 基于当前商品为用户推荐类似商品。当前版本先保留流程入口，具体推荐能力后续接入。
    steps:
      - id: start
        type: start
        next:
          - if: "slots.get('product_id')"
            then: respond
          - else: ask_product_id

      - id: ask_product_id
        type: collect
        slot_name: product_id
        response:
          text: "请先选择一个商品，再继续咨询。"
        next: respond

      - id: respond
        type: action
        action: action_recommend_similar_products
        next: end
      - id: end
        type: end
        next: []

  human_handoff:
    name: 人工客服
    description: 将当前对话转交给人工客服处理。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "好的，我来为你转接人工客服，请稍等。"
        next: end

      - id: end
        type: end
        next: []
